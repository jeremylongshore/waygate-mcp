name: 🚀 Waygate MCP CI/CD Pipeline

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ========================================
  # SECURITY SCANNING (CRITICAL)
  # ========================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for security analysis

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node for the released audit harness
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/security/package-lock.json

      - name: Install pinned security tools
        run: |
          npm ci --ignore-scripts --prefix ci/security
          pip install 'bandit[toml]==1.9.4' 'semgrep==1.178.0'
          bash ci/security/install-tools.sh "$RUNNER_TEMP/security-bin"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/security/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify security failure contracts
        run: python -m unittest discover -s ci -p 'test_security*.py' -v

      - name: Run fail-closed security measurements
        run: python ci/security_scan.py --output "$RUNNER_TEMP/waygate-security-reports"

      - name: Retain security evidence on success or failure
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports-${{ github.run_number }}
          path: ${{ runner.temp }}/waygate-security-reports/
          if-no-files-found: error
          retention-days: 90

  # ========================================
  # CODE QUALITY & TESTING
  # ========================================
  test:
    name: 🧪 Test & Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt
          pip install -r source/requirements-dev.txt
          pip install 'pytest==9.1.1' 'pytest-cov==7.1.0' 'pytest-asyncio==1.4.0' 'black==26.10.1' 'isort==9.0.1' 'flake8==7.4.1' 'mypy==2.3.1'

      - name: 🎨 Code formatting check
        run: |
          black --check source/
          isort --check-only source/

      - name: 🔍 Linting
        run: |
          flake8 source/ --max-line-length=88 --extend-ignore=E203,W503

      - name: 🏷️ Type checking
        run: |
          mypy source/ --ignore-missing-imports

      - name: 🧪 Run tests with coverage
        run: |
          pytest source/ --cov=source --cov-report=xml --cov-report=html --cov-report=term

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: 📈 Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  # ========================================
  # DOCKER BUILD & SECURITY
  # ========================================
  docker:
    name: 🐳 Docker Security
    runs-on: ubuntu-latest
    needs: [security, test]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ Build Docker image
        run: |
          docker build -f deployment/Dockerfile -t waygate-mcp:test .

      - name: 🔍 Scan Docker image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL \
            --format json --output trivy-report.json waygate-mcp:test || true

          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --exit-code 1 --severity CRITICAL \
            waygate-mcp:test

      - name: 📊 Upload Docker scan results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-security-scan
          path: trivy-report.json

  # ========================================
  # DEPLOYMENT VALIDATION
  # ========================================
  deploy-test:
    name: 🚀 Deployment Test
    runs-on: ubuntu-latest
    needs: [security, test, docker]
    env:
      DATABASE_URL: sqlite:////app/data/ci.db
      MCP_SERVERS_ENABLED: ""
      MCP_AUTO_INITIALIZE: "false"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐳 Start services
        run: docker compose -p waygate-ci -f deployment/docker-compose.yml up --build -d --wait --wait-timeout 120 waygate

      - name: 🧪 Verify database and HTTP tools
        run: |
          docker compose -p waygate-ci -f deployment/docker-compose.yml exec -T waygate python -c \
            'import sqlite3; db = sqlite3.connect("/app/data/ci.db"); assert db.execute("SELECT count(*) FROM config").fetchone()[0] >= 5'
          python deployment/scripts/ci-smoke.py

      - name: 📋 Container diagnostics
        if: failure()
        run: docker compose -p waygate-ci -f deployment/docker-compose.yml logs --no-color waygate

      - name: 🛑 Cleanup
        if: always()
        run: docker compose -p waygate-ci -f deployment/docker-compose.yml down --volumes

  # ========================================
  # PERFORMANCE BENCHMARKS
  # ========================================
  benchmark:
    name: ⚡ Performance Benchmark
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          pip install -r source/requirements.txt
          pip install 'pytest-benchmark==5.3.0'

      - name: ⚡ Run performance tests
        run: |
          pytest source/ -k "benchmark" --benchmark-json=benchmark.json || true

      - name: 📊 Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json

  # ========================================
  # RELEASE MANAGEMENT
  # ========================================
  release:
    name: 📦 Release Management
    runs-on: ubuntu-latest
    needs: [security, test, docker, deploy-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Semantic Release
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 19
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # NOTIFICATIONS
  # ========================================
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [security, test, docker, deploy-test]
    if: always()

    steps:
      - name: 📊 Workflow Summary
        run: |
          {
            echo "## 🎯 Waygate MCP CI/CD Summary"
            echo "- 🔒 Security: ${{ needs.security.result }}"
            echo "- 🧪 Tests: ${{ needs.test.result }}"
            echo "- 🐳 Docker: ${{ needs.docker.result }}"
            echo "- 🚀 Deploy: ${{ needs.deploy-test.result }}"

            if [[ "${{ needs.security.result }}" == "failure" ]]; then
              echo "❌ **CRITICAL: Security scan failed!**"
            fi

            echo "📊 View detailed reports in workflow artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
