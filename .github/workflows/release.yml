name: Release

on:
  workflow_run:
    workflows: ['🚀 Waygate MCP CI/CD Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main push CI run for the current commit
        required: true
        type: string
      dry_run:
        description: Validate without creating a tag or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: waygate-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release contracts
        run: python -m unittest discover -s ci/release -p 'test_*.py' -v
      - name: Publish validated version or record no-op
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--run-id "$CI_RUN_ID")
          if [[ "$DRY_RUN" != 'true' ]]; then args+=(--publish); fi
          python ci/release/publish.py "${args[@]}" | tee "$RUNNER_TEMP/release-receipt.json"
      - name: Preserve release receipt
        uses: actions/upload-artifact@v7
        with:
          name: release-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
